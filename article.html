<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1220">
    <link rel="manifest" href="manifest.webmanifest">
    <title data-i18n="title.article">Паспорт — RFC Garden</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .art-badges { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 6px; }
        .art-sec { margin-top: 30px; }
        .art-sec h2 { font-size: 21px; font-weight: 800; margin-bottom: 10px; letter-spacing: -.02em; }
        .art-sec p, .art-sec li { font-size: 14.5px; color: var(--text-dim); line-height: 1.65; }
        .art-sec ul, .art-sec ol { margin: 8px 0 8px 22px; }
        .art-sec li { margin-bottom: 8px; }
        .art-sec li strong, .art-sec p strong { color: var(--text); }
        .cmd-block { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
        .cmd-block code { flex: 1; min-width: 220px; }
        .rel-links { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        .rel-links a { border: 1px solid var(--line-strong); border-radius: 20px;
            padding: 4px 14px; font-size: 13px; color: var(--text); }
        .rel-links a:hover { border-color: var(--accent); color: var(--accent); }
        .art-nav { display: flex; gap: 12px; flex-wrap: wrap; margin: 34px 0 60px; align-items: center; }
        .art-nav .spacer { flex: 1; }
        details { background: var(--bg-panel); border: 1px solid var(--line);
            border-radius: var(--radius-sm); padding: 12px 16px; margin-bottom: 10px; }
        details summary { cursor: pointer; font-weight: 600; font-size: 14px; }
        details p { margin: 8px 0 0; font-size: 14px; color: var(--text-dim); }
        .art-note { border: 1px dashed var(--line-strong); border-radius: var(--radius-sm);
            padding: 14px 18px; font-size: 14px; color: var(--text-dim); margin-top: 18px; }
    </style>
</head>
<body data-theme="dark">
    <nav class="navbar">
        <div class="logo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22V8M12 8c0-3 2-5 5-5s-2 5-5 5zm0 0c0-3-2-5-5-5s2 5 5 5z"/><path d="M12 22c4 0 7-3 7-7h-7z"/></svg>
            <a href="index.html">RFC Garden</a>
        </div>
        <ul class="nav-menu">
            <li><a href="index.html" data-i18n="nav.home">Главная</a></li>
            <li><a href="explore.html" data-i18n="nav.garden">Сад</a></li>
            <li><a href="encyclopedia.html" data-i18n="nav.encyclopedia">Энциклопедия</a></li>
            <li><a href="demo.html" data-i18n="nav.demo">Демо</a></li>
            <li><a href="linux.html" data-i18n="nav.linux">Линукс</a></li>
            <li><a href="timeline.html" data-i18n="nav.timeline">Таймлайн</a></li>
            <li><a href="guide.html" data-i18n="nav.guide">Гайд</a></li>
            <li><a href="learn.html" data-i18n="nav.learn">Обучение</a></li>
            <li><a href="contribute.html" data-i18n="nav.contribute">Вклад</a></li>
        </ul>
        <button id="themeToggle" class="theme-btn" aria-label="Тема" data-i18n-attr="aria-label:theme.aria"></button>
        <button id="langToggle" class="theme-btn" aria-label="Switch to English">EN</button>
    </nav>

    <main class="article" style="padding-top:40px; max-width:800px;" id="artMain"></main>

    <footer>
        <div><h4>RFC Garden</h4><p data-i18n="foot.mit">Open Source · MIT</p></div>
    </footer>
    <script src="js/i18n.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/data.js"></script>
    <script src="js/profiles.js"></script>
    <script src="js/theme.js"></script>
    <script>
        (function () {
            "use strict";
            const T = (k, fb) => I18N.t(k, fb);
            const RUCAT = { hardware: "железо", os: "ОС", virt: "виртуализация",
                lang: "языки", ai: "ИИ" };
            const RULAYER = { application: "прикладной", presentation: "защита",
                session: "сеансовый", transport: "транспортный", network: "сетевой",
                link: "канальный", physical: "физический" };
            const box = document.getElementById("artMain");
            const params = new URLSearchParams(location.search);
            const id = params.get("id");
            const ps = protocolsData.protocols;
            const idx = ps.findIndex((p) => p.id === id);
            const esc = (s) => String(s == null ? "" : s)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            if (idx === -1) {
                box.innerHTML = "<h1>" + T("art.notfound", "Не найдено") + "</h1>" +
                    '<p><a href="encyclopedia.html" class="btn btn-secondary">' +
                    T("art.back", "← В энциклопедию") + "</a></p>";
                return;
            }
            const p = ps[idx];
            const prof = (window.PROFILES || {})[p.id];
            const typeName = p.number ? "RFC " + p.number
                : T("cat." + p.category, RUCAT[p.category] || p.category);
            const statusName = T("status." + p.status,
                { active: "активен", updated: "обновлён", legacy: "устарел" }[p.status] || p.status);
            const layerName = T("layer." + p.layer, RULAYER[p.layer] || p.layer);
            document.title = p.name + " — RFC Garden";

            let html = '<p><a href="encyclopedia.html" style="color:var(--accent);">' +
                T("art.back", "← В энциклопедию") + "</a></p>";
            html += "<h1 style=\"font-size:36px;font-weight:800;letter-spacing:-.03em;\">" +
                esc(p.name) + "</h1>";
            html += '<p class="sec-sub">' + esc(p.fullName || "") + "</p>";
            html += '<div class="art-badges"><span class="badge-kind">' + esc(typeName) +
                " · " + p.year + '</span><span class="badge-kind">' + esc(layerName) +
                '</span><span class="badge st-' + p.status + '">' + esc(statusName) + "</span>";
            if (prof) html += '<span class="badge-full">' + T("enc.full", "Полный паспорт") + "</span>";
            html += "</div>";

            const sec = (title, inner) =>
                '<section class="art-sec"><h2>' + title + "</h2>" + inner + "</section>";
            const para = (s) => "<p>" + esc(s) + "</p>";

            if (prof) {
                html += sec(T("art.origin", "Происхождение"), para(prof.origin));
                if (prof.varieties && prof.varieties.length) {
                    html += sec(T("art.varieties", "Разновидности"),
                        "<ul>" + prof.varieties.map((v) =>
                            "<li><strong>" + esc(v.t) + ":</strong> " + esc(v.d) + "</li>").join("") + "</ul>");
                }
                html += sec(T("art.how", "Как работает"), para(prof.how));
                if (prof.practice && prof.practice.length) {
                    html += sec(T("art.practice", "Попробуй сам"),
                        prof.practice.map((pr, i) =>
                            '<div class="cmd-block"><code class="mono">' + esc(pr.cmd) + "</code>" +
                            '<button class="btn btn-secondary btn-sm" data-copy="' + i + '">' +
                            T("art.copy", "Скопировать") + "</button></div><p>" + esc(pr.d) + "</p>").join(""));
                }
                if (prof.quiz && prof.quiz.length) {
                    html += sec(T("art.quiz", "Проверь себя"),
                        prof.quiz.map((qz) =>
                            "<details><summary>" + esc(qz.q) + "</summary><p>" +
                            esc(qz.a) + "</p></details>").join(""));
                }
            } else {
                html += '<div class="art-note"><strong>' + T("art.short", "Краткий паспорт") +
                    ".</strong> " + T("art.shortNote",
                    "Полная статья ещё пишется — пока здесь всё, что знает сад. Хочешь дополнить?") +
                    ' <a href="contribute.html" style="color:var(--accent);">' +
                    T("art.write", "Написать статью →") + "</a></div>";
                html += sec(T("art.about", "Что это"), para(p.description || "") +
                    (p.where ? para(T("card.where", "Где встречается: {w}").replace("{w}", p.where)) : "") +
                    (p.fact ? "<p>" + ICON.render("lightbulb") + " " + esc(p.fact) + "</p>" : ""));
            }

            const relLinks = (ids) => (ids || []).map((rid) => {
                const t = ps.find((x) => x.id === rid);
                const label = t ? t.name : rid;
                return '<a href="article.html?id=' + rid + '">' + esc(label) + "</a>";
            }).join("");
            let rel = "";
            if (p.dependsOn && p.dependsOn.length)
                rel += "<p><strong>" + T("art.depends", "Стоит на:") + "</strong></p>" +
                    '<div class="rel-links">' + relLinks(p.dependsOn) + "</div>";
            if (p.usedBy && p.usedBy.length)
                rel += "<p style=\"margin-top:12px;\"><strong>" + T("art.usedby", "На нём стоит:") +
                    "</strong></p>" + '<div class="rel-links">' + relLinks(p.usedBy) + "</div>";
            if (rel) html += sec(T("art.relations", "Связи"), rel);

            const prev = ps[(idx - 1 + ps.length) % ps.length];
            const next = ps[(idx + 1) % ps.length];
            html += '<div class="art-nav"><a href="explore.html#' + p.id +
                '" class="btn btn-primary">' + T("art.ingarden", "Смотреть в саду") + "</a>" +
                '<span class="spacer"></span>' +
                '<a href="article.html?id=' + prev.id + '" class="btn btn-secondary">← ' + esc(prev.name) + "</a>" +
                '<a href="article.html?id=' + next.id + '" class="btn btn-secondary">' + esc(next.name) + " →</a></div>";
            box.innerHTML = html;

            box.querySelectorAll("[data-copy]").forEach((btn) => {
                btn.addEventListener("click", () => {
                    const code = btn.parentElement.querySelector("code");
                    const done = () => {
                        const old = btn.textContent;
                        btn.textContent = T("art.copied", "Скопировано");
                        setTimeout(() => { btn.textContent = old; }, 1500);
                    };
                    const txt = code ? code.textContent : "";
                    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(done, done);
                    else {
                        const ta = document.createElement("textarea");
                        ta.value = txt; document.body.appendChild(ta);
                        ta.select();
                        try { document.execCommand("copy"); } catch (e) {}
                        ta.remove(); done();
                    }
                });
            });
        })();
    </script>
</body>
</html>
