<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1220">
    <link rel="manifest" href="manifest.webmanifest">
    <title data-i18n="title.stats">Статистика — RFC Garden</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; margin: 24px 0; }
        .stat-card { background: var(--bg-panel); border: 1px solid var(--line);
            border-radius: var(--radius-sm); padding: 18px; text-align: center; }
        .stat-card b { display: block; font-size: 32px; color: var(--accent);
            font-family: 'JetBrains Mono', monospace; }
        .stat-card span { font-size: 12px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 1px; }
        .bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; font-size: 13.5px; }
        .bar-row .bl { width: 170px; flex-shrink: 0; }
        .bar-row .bl a { color: var(--text); }
        .bar-row .bl a:hover { color: var(--accent); }
        .bar-track { flex: 1; height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
        .bar-track i { display: block; height: 100%; border-radius: 5px; }
        .bar-num { width: 30px; text-align: right; font-family: 'JetBrains Mono', monospace; color: var(--text-dim); }
    </style>
</head>
<body data-theme="dark">
    <nav class="navbar">
        <div class="logo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22V8M12 8c0-3 2-5 5-5s-2 5-5 5zm0 0c0-3-2-5-5-5s2 5 5 5z"/><path d="M12 22c4 0 7-3 7-7h-7z"/></svg>
            <a href="index.html">RFC Garden</a>
        </div>
        <ul class="nav-menu">
            <li><a href="index.html" data-i18n="nav.home">Главная</a></li>
            <li><a href="explore.html" data-i18n="nav.garden">Сад</a></li>
            <li><a href="encyclopedia.html" data-i18n="nav.encyclopedia">Энциклопедия</a></li>
            <li><a href="demo.html" data-i18n="nav.demo">Демо</a></li>
            <li><a href="timeline.html" data-i18n="nav.timeline">Таймлайн</a></li>
            <li><a href="guide.html" data-i18n="nav.guide">Гайд</a></li>
            <li><a href="learn.html" data-i18n="nav.learn">Обучение</a></li>
            <li><a href="contribute.html" data-i18n="nav.contribute">Вклад</a></li>
        </ul>
        <button id="themeToggle" class="theme-btn" aria-label="Тема" data-i18n-attr="aria-label:theme.aria"></button>
        <button id="langToggle" class="theme-btn" aria-label="Switch to English">EN</button>
    </nav>

    <main style="max-width:860px;">
        <h1 class="sec-title" style="margin-top:40px;" data-i18n="st.h1">Сад в цифрах</h1>
        <p class="sec-sub" data-i18n="st.sub">Вся статистика считается из данных сада автоматически.</p>
        <div class="stat-grid" id="statGrid"></div>
        <h2 class="sec-title" style="font-size:22px;" data-i18n="st.top">Самые связанные узлы</h2>
        <p class="sec-sub" data-i18n="st.top.sub">Размер растения в саду = количество связей.</p>
        <div id="topBars"></div>
        <h2 class="sec-title" style="font-size:22px; margin-top:36px;" data-i18n="st.layers">По слоям</h2>
        <div id="layerBars"></div>
        <div style="margin:36px 0 60px; display:flex; gap:14px; flex-wrap:wrap;">
            <a href="explore.html" class="btn btn-primary"><span data-icon="sprout"></span><span data-i18n="st.cta1">Смотреть сад</span></a>
            <a href="quiz.html" class="btn btn-secondary" data-i18n="st.cta2">Проверить себя</a>
        </div>
    </main>

    <script src="js/i18n.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/data.js"></script>
    <script src="js/theme.js"></script>
    <script>
        (function () {
            "use strict";
            const ps = protocolsData.protocols;
            const T = (k, fb) => I18N.t(k, fb);
            const conn = (p) => (p.dependsOn?.length || 0) + (p.usedBy?.length || 0);
            const years = ps.map((p) => p.year);
            const cards = [
                [ps.length, T("st.protocols", "объектов")],
                [ps.reduce((s, p) => s + (p.dependsOn?.length || 0), 0), T("st.links", "связей")],
                [Math.min.apply(null, years), T("st.oldest", "самый старый")],
                [Math.max.apply(null, years), T("st.newest", "самый новый")],
                [new Set(ps.map((p) => p.layer)).size, T("st.layersCount", "слоёв")],
                [new Set(ps.map((p) => p.category)).size, T("st.purposes", "назначений")],
            ];
            const grid = document.getElementById("statGrid");
            cards.forEach(([n, label]) => {
                const d = document.createElement("div");
                d.className = "stat-card";
                d.innerHTML = `<b>${n}</b><span>${label}</span>`;
                grid.appendChild(d);
            });
            function bars(boxId, rows) {
                const box = document.getElementById(boxId);
                const max = Math.max.apply(null, rows.map((r) => r.count));
                rows.forEach((r) => {
                    const d = document.createElement("div");
                    d.className = "bar-row";
                    d.innerHTML = `<span class="bl">${r.link}</span>
                        <span class="bar-track"><i style="width:${Math.round((r.count / max) * 100)}%;background:${r.color}"></i></span>
                        <span class="bar-num">${r.count}</span>`;
                    box.appendChild(d);
                });
            }
            bars("topBars", ps.map((p) => ({ p, count: conn(p) }))
                .sort((a, b) => b.count - a.count).slice(0, 8)
                .map(({ p, count }) => ({
                    link: `<a href="explore.html#${p.id}">${p.name}</a>`,
                    count, color: p.color,
                })));
            const layerNames = {
                application: T("layer.app", "Application"),
                presentation: T("layer.presentation", "Security"),
                session: T("layer.session", "Session"),
                transport: T("layer.transport", "Transport"),
                network: T("layer.network", "Network"),
                link: T("layer.link", "Link"),
                physical: T("layer.physical", "Physical"),
            };
            const byLayer = {};
            ps.forEach((p) => { byLayer[p.layer] = (byLayer[p.layer] || 0) + 1; });
            bars("layerBars", Object.keys(byLayer).map((l) => {
                const c = (ps.find((p) => p.layer === l) || {}).color || "#34d399";
                return { link: `<a href="explore.html?layer=${l}">${layerNames[l] || l}</a>`,
                    count: byLayer[l], color: c };
            }));
        })();
    </script>
</body>
</html>
