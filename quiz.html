<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1220">
    <link rel="manifest" href="manifest.webmanifest">
    <title data-i18n="title.quiz">Квиз — RFC Garden</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .quiz-box { background: var(--bg-panel); border: 1px solid var(--line);
            border-radius: var(--radius); padding: 28px; margin-top: 24px; }
        .quiz-progress { height: 8px; background: var(--line); border-radius: 4px;
            margin-bottom: 20px; overflow: hidden; }
        .quiz-progress i { display: block; height: 100%; background: var(--accent);
            border-radius: 4px; transition: width .3s; }
        .quiz-q { font-size: 19px; font-weight: 700; margin-bottom: 6px; }
        .quiz-hint { font-size: 13px; color: var(--text-faint); margin-bottom: 18px; }
        .quiz-opts { display: grid; gap: 10px; }
        .quiz-opt {
            text-align: left; padding: 12px 18px; border-radius: 11px;
            border: 1px solid var(--line-strong); background: transparent;
            font-size: 15px; transition: all .2s;
        }
        .quiz-opt:hover:not(:disabled) { border-color: var(--accent); transform: translateX(4px); }
        .quiz-opt:disabled { cursor: default; opacity: .85; }
        .quiz-opt.good { border-color: var(--green); background: rgba(74,222,128,.12); }
        .quiz-opt.bad { border-color: var(--red); background: rgba(248,113,113,.12); }
        .quiz-fact { font-size: 13.5px; color: var(--text-dim); margin-top: 16px; }
        .quiz-next { margin-top: 18px; }
        .quiz-result { text-align: center; padding: 20px 0; }
        .quiz-score { font-size: 56px; font-weight: 800; color: var(--accent); }
        .quiz-review { text-align: left; margin-top: 16px; }
        .quiz-review a { color: var(--accent); }
    </style>
</head>
<body data-theme="dark">
    <nav class="navbar">
        <div class="logo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22V8M12 8c0-3 2-5 5-5s-2 5-5 5zm0 0c0-3-2-5-5-5s2 5 5 5z"/><path d="M12 22c4 0 7-3 7-7h-7z"/></svg>
            <a href="index.html">RFC Garden</a>
        </div>
        <ul class="nav-menu">
            <li><a href="index.html" data-i18n="nav.home">Главная</a></li>
            <li><a href="explore.html" data-i18n="nav.garden">Сад</a></li>
            <li><a href="encyclopedia.html" data-i18n="nav.encyclopedia">Энциклопедия</a></li>
            <li><a href="demo.html" data-i18n="nav.demo">Демо</a></li>
            <li><a href="timeline.html" data-i18n="nav.timeline">Таймлайн</a></li>
            <li><a href="guide.html" data-i18n="nav.guide">Гайд</a></li>
            <li><a href="learn.html" data-i18n="nav.learn">Обучение</a></li>
            <li><a href="contribute.html" data-i18n="nav.contribute">Вклад</a></li>
        </ul>
        <button id="themeToggle" class="theme-btn" aria-label="Тема" data-i18n-attr="aria-label:theme.aria"></button>
        <button id="langToggle" class="theme-btn" aria-label="Switch to English">EN</button>
    </nav>

    <main style="max-width:720px;">
        <h1 class="sec-title" style="margin-top:40px;" data-i18n="q.h1">Проверь себя</h1>
        <p class="sec-sub" data-i18n="q.sub">10 случайных вопросов по саду. Угадай протокол по описанию.</p>
        <div class="quiz-box" id="quizBox" aria-live="polite"></div>
        <div style="margin:24px 0 40px; display:flex; gap:14px; flex-wrap:wrap;">
            <a href="explore.html" class="btn btn-secondary"><span data-icon="sprout"></span><span data-i18n="q.cta1">Подглядеть в сад</span></a>
            <a href="guide.html" class="btn btn-secondary" data-i18n="q.cta2">Гайд за 5 минут</a>
        </div>
    </main>

    <script src="js/i18n.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/data.js"></script>
    <script src="js/theme.js"></script>
    <script>
        (function () {
            "use strict";
            const box = document.getElementById("quizBox");
            const N = 10;
            let order = [], idx = 0, score = 0, missed = [], t0 = 0;
            const Q = (k, fb) => I18N.t(k, fb);
            const RUCAT = { hardware: "железо", os: "ОС", virt: "виртуализация",
                lang: "языки", ai: "ИИ" };
            const typeName = (o) => o.number ? "RFC " + o.number
                : Q("cat." + o.category, RUCAT[o.category] || o.category);

            function shuffle(a) {
                for (let i = a.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    const t = a[i]; a[i] = a[j]; a[j] = t;
                }
                return a;
            }
            function start() {
                order = shuffle(protocolsData.protocols.slice()).slice(0, N);
                idx = 0; score = 0; missed = []; t0 = Date.now();
                ask();
            }
            function ask() {
                const p = order[idx];
                const useWhere = Math.random() < .4 && p.where;
                const pool = shuffle(protocolsData.protocols.filter((x) => x.id !== p.id)).slice(0, 3);
                const opts = shuffle([p].concat(pool));
                box.innerHTML = "";
                const bar = document.createElement("div");
                bar.className = "quiz-progress";
                bar.innerHTML = `<i style="width:${(idx / N) * 100}%"></i>`;
                box.appendChild(bar);
                const q = document.createElement("div");
                q.className = "quiz-q";
                q.textContent = Q("q.q", `Вопрос ${idx + 1}/${N}: что это?`)
                    .replace("{i}", idx + 1).replace("{n}", N);
                box.appendChild(q);
                const h = document.createElement("div");
                h.className = "quiz-hint";
                h.textContent = useWhere
                    ? Q("q.where", `Где встречается: ${p.where}`).replace("{w}", p.where)
                    : p.description;
                box.appendChild(h);
                const wrap = document.createElement("div");
                wrap.className = "quiz-opts";
                opts.forEach((o) => {
                    const b = document.createElement("button");
                    b.className = "quiz-opt";
                    b.textContent = `${o.name} · ${typeName(o)}`;
                    b.addEventListener("click", () => answer(o.id === p.id, b, wrap, p));
                    wrap.appendChild(b);
                });
                box.appendChild(wrap);
            }
            function answer(good, btn, wrap, p) {
                const btns = wrap.querySelectorAll("button");
                btns.forEach((b) => { b.disabled = true; });
                btn.classList.add(good ? "good" : "bad");
                if (good) { score++; }
                else {
                    missed.push(p);
                    btns.forEach((b) => {
                        if (b.textContent.indexOf(p.name) === 0) b.classList.add("good");
                    });
                }
                const f = document.createElement("div");
                f.className = "quiz-fact";
                f.innerHTML = ICON.render("lightbulb") + " " + (p.fact || "");
                box.appendChild(f);
                const nx = document.createElement("button");
                nx.className = "btn btn-primary quiz-next";
                nx.textContent = idx + 1 === N ? Q("q.result", "Результат") : Q("q.next", "Дальше →");
                nx.addEventListener("click", () => { idx++; idx < N ? ask() : finish(); });
                box.appendChild(nx);
            }
            function finish() {
                const secs = Math.round((Date.now() - t0) / 1000);
                box.innerHTML = "";
                const r = document.createElement("div");
                r.className = "quiz-result";
                const praise =
                    score === N ? Q("q.perfect", "Идеально! Ты — корень сада 🌳") :
                    score >= 7 ? Q("q.good", "Отлично! Почти ботаник сетей.") :
                    score >= 4 ? Q("q.mid", "Неплохо. Загляни в сад и повтори.") :
                    Q("q.low", "Стоит пройти гайд — и попробовать снова.");
                r.innerHTML = `<div class="quiz-score">${score}/${N}</div>
                    <p class="sec-sub">${Q("q.time", "Время: {s} сек").replace("{s}", secs)} · ${praise}</p>`;
                box.appendChild(r);
                if (missed.length) {
                    const rev = document.createElement("div");
                    rev.className = "quiz-review";
                    rev.innerHTML = `<strong>${Q("q.review", "Повторить:")}</strong> ` + missed.map((p) =>
                        `<a href="explore.html#${p.id}">${p.name}</a>`).join(" · ");
                    box.appendChild(rev);
                }
                const again = document.createElement("button");
                again.className = "btn btn-primary quiz-next";
                again.textContent = Q("q.again", "↻ Ещё раз");
                again.addEventListener("click", start);
                box.appendChild(again);
            }
            start();
        })();
    </script>
</body>
</html>
