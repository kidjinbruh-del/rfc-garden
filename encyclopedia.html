<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1220">
    <link rel="manifest" href="manifest.webmanifest">
    <title data-i18n="title.encyclopedia">Энциклопедия — RFC Garden</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .ency-tools { display: flex; gap: 12px; flex-wrap: wrap; margin: 22px 0 26px; align-items: center; }
        .ency-count { font-size: 13px; color: var(--text-faint); margin-left: auto; }
        .ency-card .badge-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 4px; }
        .badge-kind { border: 1px solid var(--line-strong); color: var(--text-dim);
            border-radius: 20px; padding: 2px 10px; font-size: 11.5px; }
        .badge-full { border: 1px solid var(--accent); color: var(--accent);
            border-radius: 20px; padding: 2px 10px; font-size: 11.5px; }
        .ency-card p.desc { min-height: 60px; }
        .ency-card a.read { color: var(--accent); font-size: 13.5px; font-weight: 600; }
    </style>
</head>
<body data-theme="dark">
    <nav class="navbar">
        <div class="logo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22V8M12 8c0-3 2-5 5-5s-2 5-5 5zm0 0c0-3-2-5-5-5s2 5 5 5z"/><path d="M12 22c4 0 7-3 7-7h-7z"/></svg>
            <a href="index.html">RFC Garden</a>
        </div>
        <ul class="nav-menu">
            <li><a href="index.html" data-i18n="nav.home">Главная</a></li>
            <li><a href="explore.html" data-i18n="nav.garden">Сад</a></li>
            <li><a href="encyclopedia.html" class="active" data-i18n="nav.encyclopedia">Энциклопедия</a></li>
            <li><a href="timeline.html" data-i18n="nav.timeline">Таймлайн</a></li>
            <li><a href="guide.html" data-i18n="nav.guide">Гайд</a></li>
            <li><a href="learn.html" data-i18n="nav.learn">Обучение</a></li>
            <li><a href="contribute.html" data-i18n="nav.contribute">Вклад</a></li>
        </ul>
        <button id="themeToggle" class="theme-btn" aria-label="Тема" data-i18n-attr="aria-label:theme.aria"></button>
        <button id="langToggle" class="theme-btn" aria-label="Switch to English">EN</button>
    </nav>

    <main style="max-width:1000px;">
        <h1 class="sec-title" style="margin-top:40px;" data-i18n="enc.h1">Энциклопедия сада</h1>
        <p class="sec-sub" data-i18n="enc.sub">История, разновидности и практика каждого из 72 объектов — всё на сайте, без внешних ссылок.</p>
        <div class="ency-tools">
            <div class="search-wrap">
                <span data-icon="search"></span>
                <input type="text" class="search-box" id="encySearch"
                       data-i18n-attr="placeholder:enc.search.ph|aria-label:enc.search.aria"
                       placeholder="Найти: TCP, Linux, Docker…" autocomplete="off" aria-label="Поиск по энциклопедии">
            </div>
            <select class="cat-select" id="encyCat" data-i18n-attr="aria-label:enc.cat.aria" aria-label="Фильтр по назначению"></select>
            <select class="cat-select" id="encyLayer" data-i18n-attr="aria-label:enc.layer.aria" aria-label="Фильтр по ярусу"></select>
            <span class="ency-count" id="encyCount" aria-live="polite"></span>
        </div>
        <div class="grid-cards" id="encyGrid"></div>
        <div style="margin:36px 0 60px;">
            <a href="contribute.html" class="btn btn-secondary" data-i18n="enc.cta">Написать статью</a>
        </div>
    </main>

    <footer>
        <div><h4>RFC Garden</h4><p data-i18n="foot.mit">Open Source · MIT</p></div>
    </footer>
    <script src="js/i18n.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/data.js"></script>
    <script src="js/profiles.js"></script>
    <script src="js/theme.js"></script>
    <script>
        (function () {
            "use strict";
            const T = (k, fb) => I18N.t(k, fb);
            const RUCAT = { hardware: "железо", os: "ОС", virt: "виртуализация",
                lang: "языки", ai: "ИИ" };
            const RULAYER = { application: "прикладной", presentation: "защита",
                session: "сеансовый", transport: "транспортный", network: "сетевой",
                link: "канальный", physical: "физический" };
            const typeName = (p) => p.number ? "RFC " + p.number
                : T("cat." + p.category, RUCAT[p.category] || p.category);
            const grid = document.getElementById("encyGrid");
            const q = document.getElementById("encySearch");
            const catSel = document.getElementById("encyCat");
            const layerSel = document.getElementById("encyLayer");
            const count = document.getElementById("encyCount");

            function buildSelect(sel, values, labelOf, allLabel) {
                sel.innerHTML = "";
                const all = document.createElement("option");
                all.value = "all"; all.textContent = allLabel;
                sel.appendChild(all);
                values.forEach((v) => {
                    const o = document.createElement("option");
                    o.value = v; o.textContent = labelOf(v);
                    sel.appendChild(o);
                });
                sel.value = "all";
            }
            const cats = [];
            protocolsData.protocols.forEach((p) => {
                if (cats.indexOf(p.category) === -1) cats.push(p.category);
            });
            cats.sort();
            const catLabel = (c) => T("cat." + c, (RUCAT[c] || c).replace("_", " "));
            buildSelect(catSel, cats, catLabel, T("cat.all", "Все назначения"));
            const layers = ["application", "presentation", "session", "transport",
                "network", "link", "physical"];
            buildSelect(layerSel, layers,
                (l) => T("layer." + l, RULAYER[l] || l),
                T("e.layer.all", "Все уровни"));

            function render() {
                const query = (q.value || "").trim().toLowerCase();
                const cf = catSel.value, lf = layerSel.value;
                grid.innerHTML = "";
                let shown = 0, full = 0;
                protocolsData.protocols.forEach((p) => {
                    const hay = (p.name + " " + (p.fullName || "") + " " +
                        (p.description || "")).toLowerCase();
                    if (query && !hay.includes(query)) return;
                    if (cf !== "all" && p.category !== cf) return;
                    if (lf !== "all" && p.layer !== lf) return;
                    shown++;
                    const hasFull = !!(window.PROFILES && window.PROFILES[p.id]);
                    if (hasFull) full++;
                    const card = document.createElement("a");
                    card.className = "card ency-card";
                    card.href = "article.html?id=" + p.id;
                    card.innerHTML =
                        '<div class="card-icon">' + ICON.render(p.plant || "sprout") + "</div>" +
                        "<h3>" + p.name + "</h3>" +
                        '<div class="badge-row"><span class="badge-kind">' +
                        typeName(p) + " · " + p.year + "</span>" +
                        (hasFull ? '<span class="badge-full">' +
                            T("enc.full", "Полный паспорт") + "</span>" : "") +
                        "</div>" +
                        '<p class="desc">' + (p.description || "") + "</p>" +
                        '<span class="read">' + T("enc.read", "Читать паспорт →") + "</span>";
                    grid.appendChild(card);
                });
                count.textContent = shown + " / " + protocolsData.protocols.length +
                    " · " + full + " " + T("enc.fullCount", "полных");
            }
            q.addEventListener("input", render);
            catSel.addEventListener("change", render);
            layerSel.addEventListener("change", render);
            render();
        })();
    </script>
</body>
</html>
